name: WakaTime Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  wakatime:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Indispensable pour autoriser l'action à modifier le dépôt
    steps:
      - name: Generate WakaTime metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.wakatime.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_wakatime: yes
          plugin_wakatime_sections: time, projects, languages
          plugin_wakatime_user: LRoffic
          plugin_wakatime_url: "https://wakapi.lripsum.net/api"
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          # Paramètres pour commiter et pousser automatiquement le fichier généré :
          committer_message: "chore: update wakatime metrics"
          output_action: commit

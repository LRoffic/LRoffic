
name: Diagnose Wakapi

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test Wakapi API
        env:
          WAKAPI_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          BASE="https://wakapi.lripsum.net"

          echo "DNS:"
          getent ahosts wakapi.lripsum.net || true

          echo "API:"
          curl -sS -L \
            --connect-timeout 10 \
            --max-time 20 \
            -o /tmp/response.json \
            -w "\nHTTP_STATUS=%{http_code}\n" \
            --get \
            --data-urlencode "api_key=$WAKAPI_KEY" \
            "$BASE/api/v1/users/LRoffic/stats/last_7_days" || true

          cat /tmp/response.json 2>/dev/null || true

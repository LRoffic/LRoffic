
name: Diagnose Wakapi

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Test Wakapi API endpoints
        env:
          WAKAPI_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          BASE="https://waka-api.lripsum.net"

          for API_PATH in \
            "/api/v1/users/LRoffic/stats/last_7_days" \
            "/api/compat/wakatime/v1/users/LRoffic/stats/last_7_days"
          do
            echo ""
            echo "===================================="
            echo "TEST: $API_PATH"
            echo "===================================="

            HTTP_CODE=$(curl \
              --connect-timeout 10 \
              --max-time 20 \
              -sS \
              -o /tmp/wakapi-response.json \
              -w "%{http_code}" \
              --get \
              --data-urlencode "api_key=$WAKAPI_KEY" \
              "$BASE$API_PATH") || true

            echo "HTTP_STATUS=${HTTP_CODE:-CONNECTION_ERROR}"
            echo "API_RESPONSE:"

            cat /tmp/wakapi-response.json 2>/dev/null || true
            rm -f /tmp/wakapi-response.json
            echo ""
          done

name: Waka Readme

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate WakaTime metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.wakatime.svg
          token: ${{ secrets.GH_TOKEN }}
          base: ""
          plugin_wakatime: yes
          plugin_wakatime_user: current
          plugin_wakatime_client_id: ${{ secrets.WAKATIME_CLIENT_ID }}
          plugin_wakatime_client_secret: ${{ secrets.WAKATIME_CLIENT_SECRET }}
          plugin_wakatime_sections: time, projects, languages
          committer_branch: main
          committer_message: "Update WakaTime metrics"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
